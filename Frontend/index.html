<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Price Scraper</title>
</head>
<body>
    
    <!-- Upper Buttons -->
    <div class="upperContainer">
        <input type="text" id="locationInput" placeholder="Search Address..." name="macro-search" class="custom-btn"/>
        <button class="custom-btn"><img src="Icons/pin.png">Place Pin</button>
        <button class="custom-btn" id="search-btn"><img src="Icons/search.png">Search</button>
    </div>


    
   <div id="sidebar" class="sidebar">
    <div class="sidebar-header">
    <button id="close-btn">×</button>
    <h2>Search Results</h2>
    <div class="sort-container">
        <label for="sortOptions"><b>Sort by:</b></label>
        <select id="sortOptions" class="sort-select">
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>

            <option value="protein-asc">Protein: Low to High</option>
            <option value="protein-desc">Protein: High to Low</option>

            <option value="carbs-asc">Carbs: Low to High</option>
            <option value="carbs-desc">Carbs: High to Low</option>

            <option value="fat-asc">Fat: Low to High</option>
            <option value="fat-desc">Fat: High to High</option>

            <option value="fiber-asc">Fiber: Low to High</option>
            <option value="fiber-desc">Fiber: High to High</option>
        </select>
    </div>
</div>
    
    <div id="resultsList" class="results-container">
        </div>
</div>

    <div class="lowerContainer">
            <div class="nutrients">
                <div class="title">Select macronutrients:</div>  
                <div class="list">
                <input type="checkbox" name="nutrient" id="protein"/>
                <label for="protein">Protein</label>

                <input type="checkbox" name="nutrient" id="carbohydrates"/>
                <label for="carbohydrates">Carbohydrates</label>

                <input type="checkbox" name="nutrient" id="fat"/>
                <label for="fat">Fat</label>

                <input type="checkbox" name="nutrient" id="fiber"/>
                <label for="fiber">Fiber</label>
            </div>
    </div>       

    <div class="controls">
    <label>Select search readius: <span id="radiusLabel" class="radius-value">5</span> km</label>
    <input type="range" id="radiusInput" min="1" max="50" value="5">
</div>

    <script src="main.js" defer></script>
</body>
</html>
