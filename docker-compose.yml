version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-password123}
      POSTGRES_DB: ${DB_NAME:-map_demo}
    ports:
      - "5432:5432"

  importer:
    image: ubuntu:22.04
    depends_on:
      - db
    volumes:
      - ./data:/osm
    environment:
     - PGPASSWORD=${DB_PASS:-password123}
     - DEBIAN_FRONTEND=noninteractive
    command: >
      bash -c "apt-get update && apt-get install -y osm2pgsql && 
      echo 'Waiting 10 seconds for database to fully start...' && sleep 10 &&
      osm2pgsql -c -d ${DB_NAME:-map_demo} -U ${DB_USER:-postgres} -H db /osm/map_data.osm.pbf"

  api:
    build: 
      context: ./Backend
      dockerfile: Dockerfile
    volumes:
      - ./Backend:/app
    ports:
      - "5000:5000"
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=${DB_HOST:-db}
      - DB_NAME=${DB_NAME:-map_demo}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASS=${DB_PASS:-password123}
      - DB_PORT=${DB_PORT:-5432}
      - PYTHONPATH=/app:/app/Crawler:/app/Crawler/Crawler
    depends_on:
      - db
    restart: always

  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html

  crawler:
    build: 
      context: ./Backend
      dockerfile: Dockerfile
    command: python Crawler/Crawler/Crawler.py
    volumes:
      - ./Backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=${DB_HOST:-db}
      - DB_NAME=${DB_NAME:-map_demo}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASS=${DB_PASS:-password123}
      - DB_PORT=${DB_PORT:-5432}
      - PYTHONPATH=/app:/app/Crawler:/app/Crawler/Crawler
    depends_on:
      - db
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    restart: always