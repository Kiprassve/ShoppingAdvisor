version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-password123}
      POSTGRES_DB: ${DB_NAME:-map_demo}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    # --- SUTAISYTAS HEALTHCHECK ---
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d map_demo"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 90s

  importer:
    image: ubuntu:22.04
    depends_on:
      - db
    volumes:

      - ./Data:/osm                          # 'Data' iš didžiosios raidės, kaip nuotraukoje
      - ./Frontend/import.sh:/osm/import.sh  # Failas yra Frontend kataloge
      - ./Frontend/kaunas.lua:/osm/kaunas.lua
    environment:
     - PGPASSWORD=${DB_PASS:-password123}
     - DEBIAN_FRONTEND=noninteractive
    command: >
      bash -c "apt-get update && apt-get install -y osm2pgsql postgresql-client && 
      chmod +x /osm/import.sh && 
      echo 'Waiting for database...' && sleep 10 &&
      /osm/import.sh"

  api:
    build: 
      context: ./Backend
      dockerfile: Dockerfile
    volumes:
      - ./Backend:/app
    ports:
      - "5000:5000"
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=${DB_HOST:-db}
      - DB_NAME=${DB_NAME:-map_demo}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASS=${DB_PASS:-password123}
      - DB_PORT=${DB_PORT:-5432}
      - PYTHONPATH=/app:/app/Crawler:/app/Crawler/Crawler
    depends_on:
      - db
    restart: always

  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html

  crawler:
    build: 
      context: ./Backend
      dockerfile: Dockerfile
    command: python Crawler/Crawler/Crawler.py
    volumes:
      - ./Backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=${DB_HOST:-db}
      - DB_NAME=${DB_NAME:-map_demo}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASS=${DB_PASS:-password123}
      - DB_PORT=${DB_PORT:-5432}
      - PYTHONPATH=/app:/app/Crawler:/app/Crawler/Crawler
    depends_on:
      db:
        condition: service_healthy
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    restart: always
