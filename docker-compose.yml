version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: map_demo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  importer:
    image: ubuntu:22.04
    depends_on:
      - db
    volumes:

      - ./Data:/osm                          # 'Data' iš didžiosios raidės, kaip nuotraukoje
      - ./Frontend/import.sh:/osm/import.sh  # Failas yra Frontend kataloge
      - ./Frontend/kaunas.lua:/osm/kaunas.lua
    environment:
     - PGPASSWORD=password123
     - DEBIAN_FRONTEND=noninteractive
    command: >
      bash -c "apt-get update && apt-get install -y osm2pgsql postgresql-client && 
      chmod +x /osm/import.sh && 
      echo 'Waiting for database...' && sleep 10 &&
      /osm/import.sh"

  api:
    build: 
      context: ./Backend
      dockerfile: Dockerfile
    volumes:
      - ./Backend:/app
    ports:
      - "5000:5000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://postgres:password123@db:5432/map_demo
      - PYTHONPATH=/app:/app/Crawler:/app/Crawler/Crawler
    depends_on:
      - db
    restart: always

  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html

  crawler:
    build: 
      context: ./Backend
      dockerfile: Dockerfile
    command: python Crawler/Crawler/Crawler.py
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://postgres:password123@db:5432/map_demo
      - PYTHONPATH=/app:/app/Crawler
    depends_on:
      - db
    restart: always

volumes:
  pgdata: