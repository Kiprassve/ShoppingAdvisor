<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Price Scraper</title>
</head>
<body>
    <!-- Upper Buttons -->
    <div class="upperContainer">
        <input type="text" id="locationInput" placeholder="Search Address..." name="macro-search" class="custom-btn"/>
        <button class="custom-btn"><img src="Icons/pin.png">Place Pin</button>
        <button class="custom-btn" id="search-btn"><img src="Icons/search.png">Search</button>
    </div>

    <div id="sidebar" class="sidebar">
    <button id="close-btn">×</button>
    <h2 div class="title">Search Results</h2>
    <div id="resultsList" class="results-container">
    </div>
    </div>

    <div class="lowerContainer">
            <div class="nutrients">
                <div class="title">Select macronutrients:</div>  
                <div class="list">
                <input type="checkbox" name="nutrient" id="protein"/>
                <label for="protein">Protein</label>

                <input type="checkbox" name="nutrient" id="carbohydrates"/>
                <label for="carbohydrates">Carbohydrates</label>

                <input type="checkbox" name="nutrient" id="fat"/>
                <label for="fat">Fat</label>

                <input type="checkbox" name="nutrient" id="fiber"/>
                <label for="fiber">Fiber</label>
            </div>
    </div>       



    <script src="main.js" defer></script>
</body>
</html>
