<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Price Scraper</title>
</head>
<body>
    <!-- Upper Buttons -->
    <div class="upperContainer">
        <input type="text" placeholder="Search Address..." name="macro-search" class="custom-btn"/>
        <!-- <label for="protein">Protein</label> -->
        <!-- <button class="custom-btn"><img src="Icons/search.png">Search Address...</button> -->
        <button class="custom-btn"><img src="Icons/pin.png">Place Pin</button>
        <!-- <button class="custom-btn"><img src="Icons/hand.png">Pan</button> -->
        <button class="custom-btn"><img src="Icons/search.png">Search</button>
    </div>

    <div class="lowerContainer">
            <div class="nutrients">
                <div class="title">Select macronutrients:</div>  
                <div class="list">
                <input type="checkbox" name="nutrient" id="protein"/>
                <label for="protein">Protein</label>

                <input type="checkbox" name="nutrient" id="carbohydrates"/>
                <label for="carbohydrates">Carbohydrates</label>

                <input type="checkbox" name="nutrient" id="fat"/>
                <label for="fat">Fat</label>
            </div>
        </div>       

        <!-- <button class="custom-btn"><img src="Icons/search.png">Search Address...</button>
        <button class="custom-btn"><img src="Icons/pin.png">Place Pin</button>
        <button class="custom-btn"><img src="Icons/hand.png">Pan</button>
        <button class="custom-btn">Search</button> -->
    </div>
</body>
</html>
